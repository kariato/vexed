name: Publish Vexed to GitHub Pages
on:
  push:
    branches: [main, phase-5-pwa, phase-6-release]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium webkit firefox
      - run: npm run test:e2e
      - run: npm run test:pwa
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: pages-release-evidence
          path: test-results
          retention-days: 14
      - uses: actions/configure-pages@v6.0.0
      - name: Build the public game only
        run: npm run build
        env:
          VITE_BASE_PATH: /vexed/
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish verified artifact
        id: deployment
        uses: actions/deploy-pages@v5.0.1
