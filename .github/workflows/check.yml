name: Engine and build checks
on:
  push:
    branches: [main, phase-1-engine, phase-2-packs, phase-3-touch, phase-4-experience, phase-5-pwa, phase-6-release]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify GitHub Pages subpath build
        run: VITE_BASE_PATH=/vexed/ npm run build

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit firefox
      - run: npm run test:e2e
      - run: npm run test:pwa

      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: browser-release-evidence
          path: test-results
          retention-days: 14
